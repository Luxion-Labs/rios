<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="rios-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030713" />
      <stop offset="50%" stop-color="#081833" />
      <stop offset="100%" stop-color="#02040B" />
    </linearGradient>
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <radialGradient id="spatial-glow" cx="75%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#030713" stop-opacity="0" />
    </radialGradient>
    <pattern id="iso-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00F2FE" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#rios-bg)" />
  <rect width="1200" height="420" fill="url(#spatial-glow)" />
  <rect width="1200" height="420" fill="url(#iso-grid)" />

  <rect x="20" y="20" width="1160" height="380" rx="14" fill="none" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.2" />

  <!-- 3D Spatial Mesh & Camera Projection Art (Right Side) -->
  <g transform="translate(850, 210)">
    <!-- Isometric Ground Grid -->
    <polygon points="0,-70 140,-10 0,60 -140,-10" fill="#0C1B3A" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="-70" y1="-40" x2="70" y2="25" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.3" />
    <line x1="70" y1="-40" x2="-70" y2="25" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.3" />

    <!-- 3D Isometric Extruded Buildings -->
    <!-- Building 1 (Center) -->
    <g transform="translate(-20, -30)">
      <!-- Top -->
      <polygon points="0,-45 25,-32 0,-19 -25,-32" fill="#00F2FE" fill-opacity="0.4" stroke="#00F2FE" stroke-width="1.5" />
      <!-- Left side -->
      <polygon points="-25,-32 0,-19 0,25 -25,12" fill="#0C254D" stroke="#00F2FE" stroke-width="1" />
      <!-- Right side -->
      <polygon points="0,-19 25,-32 25,12 0,25" fill="#153E78" stroke="#00F2FE" stroke-width="1" />
    </g>

    <!-- Building 2 (Right) -->
    <g transform="translate(45, -10)">
      <polygon points="0,-35 20,-24 0,-13 -20,-24" fill="#3B82F6" fill-opacity="0.4" stroke="#3B82F6" stroke-width="1.5" />
      <polygon points="-20,-24 0,-13 0,20 -20,9" fill="#0C254D" stroke="#3B82F6" stroke-width="1" />
      <polygon points="0,-13 20,-24 20,9 0,20" fill="#153E78" stroke="#3B82F6" stroke-width="1" />
    </g>

    <!-- Lidar Elevation Scan Pin -->
    <g transform="translate(-70, -30)">
      <line x1="0" y1="0" x2="0" y2="-55" stroke="#10B981" stroke-width="2" stroke-dasharray="3 3" />
      <circle cx="0" cy="-55" r="7" fill="#10B981" />
      <circle cx="0" cy="-55" r="14" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#10B981" />
    </g>

    <!-- Camera Frustum Projection Cone -->
    <path d="M 0 -130 L -140 -10 M 0 -130 L 140 -10 M 0 -130 L 0 60" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4" />
    <circle cx="0" cy="-130" r="6" fill="#00F2FE" />

    <text x="0" y="115" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11" letter-spacing="1" text-anchor="middle">SPATIAL PROJECTION: 2D TO 3D</text>
  </g>

  <!-- Content (Left Side) -->
  <g transform="translate(70, 75)">
    <rect width="240" height="30" rx="15" fill="#00F2FE" fill-opacity="0.12" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="15" r="4" fill="#00F2FE" />
    <text x="28" y="19" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">SPATIAL INTELLIGENCE PLATFORM</text>

    <text x="0" y="85" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
      Rios
    </text>

    <rect x="0" y="105" width="85" height="4" rx="2" fill="url(#cyan-blue)" />

    <text x="0" y="150" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" letter-spacing="-0.2">
      Interactive spatial intelligence platform combining web maps with real-time 3D visualization.
    </text>

    <text x="0" y="180" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Unified workspace to explore, monitor, and interact with real-world geospatial assets.
    </text>

    <g transform="translate(0, 240)">
      <rect width="170" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="14" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">ENGINE: THREE.JS 0.173</text>

      <rect x="185" y="0" width="180" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="199" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">GIS: LEAFLET + REACT 19</text>

      <rect x="380" y="0" width="160" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="394" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">SLA: 24H RESPONSE</text>
    </g>
  </g>
</svg>